<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iconos · IES El Majuelo</title>
<style>body{margin:0;background:#f4f7fb;color:#123047;font:16px system-ui,Arial,sans-serif}header{background:#123d69;color:white;padding:2.4rem max(1rem,calc((100vw - 1050px)/2))}main{max-width:1050px;margin:auto;padding:2rem 1rem}h1{margin:.1rem 0}p{line-height:1.5}input{border:1px solid #c6d4e0;border-radius:10px;padding:.8rem;width:min(100%,360px);font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;margin-top:1.4rem}.card{background:white;padding:1rem;border-radius:14px;box-shadow:0 2px 10px #123d6915}.card img{width:100%;aspect-ratio:1;object-fit:contain}.card h2{font-size:1rem}.card p{color:#536a7b;font-size:.85rem}.card a{color:#125787}small{color:#64748b}</style></head>
<body><header><h1>Biblioteca de iconos</h1><p>IES El Majuelo · Recursos gráficos institucionales</p></header>
<main><label for="buscar">Buscar iconos</label> <input id="buscar" placeholder="Concepto o categoría…" autocomplete="off">
<p id="estado" role="status"></p><div id="grid" class="grid"></div></main>
<script>
let iconos=[];
const grid=document.querySelector('#grid'),estado=document.querySelector('#estado'),buscar=document.querySelector('#buscar');
function pintar(){
 const q=buscar.value.toLocaleLowerCase('es').trim();grid.replaceChildren();
 const lista=iconos.filter(x=>[x.nombre,x.categoria,x.descripcion].join(' ').toLocaleLowerCase('es').includes(q));
 estado.textContent=lista.length?lista.length+' iconos disponibles':'Aún no hay iconos publicados para esta búsqueda.';
 for(const x of lista){
  const card=document.createElement('article');card.className='card';
  const img=document.createElement('img');img.src=x.archivo;img.alt=x.nombre;img.loading='lazy';
  const h=document.createElement('h2');h.textContent=x.nombre;
  const desc=document.createElement('p');desc.textContent=x.descripcion||x.categoria;
  const a=document.createElement('a');a.href=x.archivo;a.download='';a.textContent='Descargar';
  card.append(img,h,desc,a);grid.append(card);
 }
}
buscar.addEventListener('input',pintar);
fetch('./catalogo.json').then(r=>{if(!r.ok)throw Error('No se ha podido leer el catálogo');return r.json()}).then(d=>{iconos=(d.iconos||[]).filter(x=>x.estado==='aprobado');pintar()}).catch(e=>estado.textContent=e.message);
</script></body></html>

<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Principio de Huygens</title>
<style>
*{box-sizing:border-box}
body{font:16px system-ui,sans-serif;margin:0;background:#eef3f7;color:#183047}
main{max-width:1250px;margin:auto;padding:20px}
h1{margin:0 0 5px;font-size:30px}
p{margin:8px 0 16px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
canvas{width:100%;background:white;border-radius:12px;display:block}
aside,section{background:white;border-radius:12px;padding:18px}
label{display:block;margin:12px 0}
input[type=range]{width:100%;accent-color:#087e9a}
button{border:0;border-radius:7px;background:#17627b;color:white;padding:10px 14px;font:inherit;cursor:pointer}
button:disabled{opacity:.4}
button.secondary{background:#e5edf3;color:#183047}
.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.data{font-variant-numeric:tabular-nums;line-height:1.8}
small{color:#52677a}
#explain{min-height:70px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
<main>
  <h1>Principio de Huygens</h1>
  <p>Reflexión y refracción de ondas planas en la separación de dos medios.</p>
  <div class="layout">
    <div>
      <canvas id="c" width="900" height="600"></canvas>
      <section style="margin-top:12px">
        <div class="buttons">
          <button id="prev" class="secondary">◀ Etapa anterior</button>
          <button id="play">▶ Reproducir</button>
          <button id="next">Etapa siguiente ▶</button>
          <button id="reset" class="secondary">Reiniciar</button>
        </div>
        <label>Progreso de la construcción <input id="progress" type="range" min="0" max="3" step="0.002" value="0"></label>
        <strong id="stage"></strong>
        <p id="explain"></p>
      </section>
    </div>
    <aside>
      <h2 style="margin-top:0">Parámetros</h2>
      <label>Índice n₁: <b id="o1"></b><input id="n1" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label>Índice n₂: <b id="o2"></b><input id="n2" type="range" min="1" max="2.5" step="0.05" value="1.5"></label>
      <label>Incidencia: <b id="oa"></b><input id="ang" type="range" min="0" max="80" step="1" value="40"></label>
      <label for="speed">Velocidad de animación: <b id="speedValue">1×</b><input id="speed" type="range" min="0.1" max="3" step="0.1" value="1"><span style="display:flex;justify-content:space-between;font-size:12px;color:#52677a"><span>Muy lenta · 0,1×</span><span>Rápida · 3×</span></span></label>
      <label><input id="waves" type="checkbox" checked> Ondas secundarias</label>
      <label><input id="reflect" type="checkbox" checked> Reflexión</label>
      <label><input id="rays" type="checkbox" checked> Rayos y normal</label>
      <hr>
      <div id="data" class="data"></div>
      <hr>
      <small>Frente incidente y rayo incidente: azul · Frente/rayo refractado: verde · Frente/rayo reflejado: magenta. Las distancias son esquemáticas; la relación de velocidades es exacta.</small>
    </aside>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const ctx=$('c').getContext('2d');
const W=900,H=600,Y=300,X=300;
let p=0,playing=false,last=0;
const rad=Math.PI/180;
const fmt=(x,d=1)=>x.toFixed(d).replace('.',',');
const C={inc:'#0b5ed7', incSoft:'#73a7e6', refr:'#0a8f5a', refl:'#d63384', axis:'#5f6b76', text:'#183047', box:'rgba(255,255,255,0.92)'};
const stages=['1. Frente incidente','2. Ondas secundarias','3. Construcción de la envolvente','4. Reflexión y refracción'];
const desc=[
  'El frente de onda plano se aproxima a la superficie. Todos sus puntos están en la misma fase.',
  'Cada punto de la superficie alcanzado por el frente actúa como foco de ondas secundarias. Sus radios crecen con la velocidad de propagación en cada medio.',
  'La tangente común a las ondas secundarias constituye el nuevo frente de onda. La diferencia de velocidades modifica su orientación.',
  'Los rayos son perpendiculares a los frentes. La frecuencia no cambia y se cumple la ley de Snell cuando existe onda transmitida propagante.'
];

function line(x1,y1,x2,y2,col,w=2,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
function clip(top,fn){ctx.save();ctx.beginPath();ctx.rect(0,top?0:Y,W,Y);ctx.clip();fn();ctx.restore()}
function text(s,x,y,col=C.text,size=18,align='left'){ctx.fillStyle=col;ctx.font=`${size}px system-ui`;ctx.textAlign=align;ctx.fillText(s,x,y);ctx.textAlign='left'}
function labelBox(s,x,y,col=C.text,size=16,align='left'){
  ctx.save();
  ctx.font=`${size}px system-ui`;
  const padX=8,padY=5,w=ctx.measureText(s).width+padX*2,h=size+padY*2;
  const left=align==='center'?x-w/2:align==='right'?x-w:x;
  const top=y-size-padY;
  ctx.fillStyle=C.box;
  ctx.strokeStyle='rgba(24,48,71,0.12)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.roundRect(left,top,w,h,7);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle=col;
  ctx.textAlign=align;
  ctx.fillText(s,x,y);
  ctx.restore();
}
function drawThetaLabel(x,y,sub,col){
  ctx.save();
  ctx.fillStyle=col;
  ctx.font='24px system-ui';
  ctx.fillText('θ',x,y);
  const w=ctx.measureText('θ').width;
  ctx.font='16px system-ui';
  ctx.fillText(sub,x+w+1,y+5);
  ctx.restore();
}
function drawMediumLabels(n1,n2){
  labelBox(`MEDIO 1 · n₁ = ${fmt(n1,2)}`,22,30,C.text,17,'left');
  labelBox(`MEDIO 2 · n₂ = ${fmt(n2,2)}`,W-22,H-18,C.text,17,'right');
}
function arrow(x,y,a,b,col){
  line(x,y,a,b,col,3.2);
  const q=Math.atan2(b-y,a-x);
  line(a,b,a-14*Math.cos(q-.5),b-14*Math.sin(q-.5),col,2.6);
  line(a,b,a-14*Math.cos(q+.5),b-14*Math.sin(q+.5),col,2.6);
}
function drawFrontFamily(t,s,c){
  clip(true,()=>{
    for(let k=0;k<5;k++){
      let u=t-k*55;
      let x=s*u, y=Y+c*u;
      line(x-900*c,y+900*s,x+900*c,y-900*s,k===0?C.inc:C.incSoft,k===0?3.2:1.6);
    }
  });
}
function frontTrain(top,angle,vel,col,t,s,spacing,count=5){
  clip(top,()=>{
    for(let k=0;k<count;k++){
      const tau=t-k*(spacing/vel);
      let end=s<.001?W:Math.min(W,tau/s);
      if(end<0) continue;
      const pts=[0,end].map(x=>{
        const age=tau-x*s;
        return [x+Math.sin(angle)*vel*age,Y+(top?-1:1)*Math.cos(angle)*vel*age];
      });
      ctx.save();
      ctx.globalAlpha=k===0?1:Math.max(0.28,0.7-0.12*k);
      line(pts[0][0],pts[0][1],pts[1][0],pts[1][1],col,k===0?4:2.1);
      ctx.restore();
    }
  });
}
function drawAngleArc(start,end,col,radius=55){ctx.beginPath();ctx.arc(X,Y,radius,start,end);ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.stroke()}

function draw(){
  $('speedValue').textContent=fmt(+$('speed').value,1)+'×';
  let n1=+$('n1').value,n2=+$('n2').value,i=+$('ang').value*rad,s=Math.sin(i),c=Math.cos(i),v=n1/n2,z=v*s,ok=z<=1,r=ok?Math.asin(z):0;
  let approach=Y*c+8, sweep=W*s, middle=Math.max(sweep,1), t=p<1?-approach*(1-p):p<2?(p-1)*middle:middle+(p-2)*100;

  $('o1').textContent=fmt(n1,2);
  $('o2').textContent=fmt(n2,2);
  $('oa').textContent=fmt(i/rad,0)+'°';
  $('data').innerHTML=`v₁ = c/${fmt(n1,2)}<br>v₂ = c/${fmt(n2,2)}<br>v₂/v₁ = ${fmt(v,3)}<br>θᵣ = ${fmt(i/rad)}°<br>${ok?'θₜ = '+fmt(r/rad)+'°':'Reflexión interna total'}<br>λ₂/λ₁ = ${fmt(v,3)}<br><small>n₁ sen θᵢ = n₂ sen θₜ</small>`;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#f9efd7'; ctx.fillRect(0,0,W,Y);
  ctx.fillStyle='#dceff8'; ctx.fillRect(0,Y,W,Y);
  line(0,Y,W,Y,C.axis,2);
  drawMediumLabels(n1,n2);

  const frontSpacing=55;
  drawFrontFamily(t,s,c);

  if(p>=1 && $('waves').checked){
    for(let j=0;j<=18;j++){
      let x=W*j/18, age=t-x*s;
      if(age<0) continue;
      for(let top of [true,false]){
        if((top && !$('reflect').checked) || (!top && !ok)) continue;
        let rr=age*(top?1:v);
        clip(top,()=>{
          ctx.beginPath();
          ctx.arc(x,Y,rr,0,Math.PI*2);
          ctx.strokeStyle=top?C.refl:C.refr;
          ctx.globalAlpha=.68;
          ctx.lineWidth=1.5;
          ctx.stroke();
          ctx.globalAlpha=1;
        });
      }
      ctx.fillStyle='#374b5d';
      ctx.beginPath();
      ctx.arc(x,Y,3,0,Math.PI*2);
      ctx.fill();
    }
  }

  if(p>=1){
    if(ok) frontTrain(false,r,v,C.refr,t,s,frontSpacing*v,5);
    if($('reflect').checked) frontTrain(true,i,1,C.refl,t,s,frontSpacing,5);
  }

  if($('rays').checked){
    line(X,Y-170,X,Y+170,C.axis,1.4,[7,6]);
    arrow(X-160*s,Y-160*c,X,Y,C.inc);
    if(p>=2){
      if(ok) arrow(X,Y,X+160*Math.sin(r),Y+160*Math.cos(r),C.refr);
      if($('reflect').checked) arrow(X,Y,X+160*s,Y-160*c,C.refl);
    }

    labelBox('Normal',X+18,88,C.axis,15,'left');
    labelBox('Rayo incidente',150,52,C.inc,15,'left');
    if(p>=2 && $('reflect').checked) labelBox('Rayo reflejado',W-170,58,C.refl,15,'left');
    if(p>=2 && ok) labelBox('Rayo refractado',W-188,H-72,C.refr,15,'left');

    if(i>.04){
      drawAngleArc(-Math.PI/2-i,-Math.PI/2,C.inc,58);
      drawThetaLabel(X-64,Y-72,'i',C.inc);
      if(p>=2 && $('reflect').checked){
        drawAngleArc(-Math.PI/2,-Math.PI/2+i,C.refl,58);
        drawThetaLabel(X+38,Y-72,'r',C.refl);
      }
    }
    if(p>=2 && ok && r>.04){
      drawAngleArc(Math.PI/2-r,Math.PI/2,C.refr,58);
      drawThetaLabel(X+38,Y+89,'t',C.refr);
    }
  }

  if(!ok&&p>=2) labelBox('Reflexión interna total (sin frente transmitido propagante)',W/2,H-24,C.refl,16,'center');

  let idx=Math.min(3,Math.floor(p+1e-8));
  $('stage').textContent=stages[idx];
  $('explain').textContent=desc[idx];
  $('progress').value=p;
  $('prev').disabled=p===0;
  $('next').disabled=p===3;
  $('play').textContent=playing?'Ⅱ Pausar':'▶ Reproducir';
}

function tick(now){
  if(playing){
    let angle=+$('ang').value*rad;
    let span=p<1?Y*Math.cos(angle)+8:p<2?Math.max(W*Math.sin(angle),1):100;
    p=Math.min(3,p+Math.min((now-last)/1000,.05)*85*0.7*+$('speed').value/span);
    if(p===3) playing=false;
    draw();
  }
  last=now;
  requestAnimationFrame(tick);
}

$('play').onclick=()=>{ if(p===3)p=0; playing=!playing; draw(); };
$('next').onclick=()=>{ playing=false; p=Math.min(3,Math.floor(p+1e-6)+1); draw(); };
$('prev').onclick=()=>{ playing=false; p=Math.max(0,Math.ceil(p-1e-6)-1); draw(); };
$('reset').onclick=()=>{ playing=false; p=0; draw(); };
$('progress').oninput=e=>{ playing=false; p=+e.target.value; draw(); };
for(let id of ['n1','n2','ang','waves','reflect','rays','speed']) $(id).oninput=draw;
draw();
requestAnimationFrame(tick);
</script>
</html>

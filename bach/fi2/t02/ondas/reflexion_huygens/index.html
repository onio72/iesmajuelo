/* Ajuste a la ventana de proyección: el dibujo absorbe el espacio disponible. */
html,body{width:100%;height:100%;margin:0}
main{height:100vh;height:100dvh;max-width:1600px;padding:clamp(6px,1.2vh,14px) clamp(8px,1.5vw,22px);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:clamp(3px,.8vh,9px)}

main>small{font-size:clamp(10px,1.65vh,14px);line-height:1.2}
.panel{min-width:0;margin:0;padding:clamp(5px,1vh,12px);border-radius:10px}
main>.panel:first-of-type{display:flex;flex-direction:column;min-height:0;gap:clamp(3px,.6vh,7px)}
.controls{gap:5px 8px;flex:0 0 auto;justify-content:center;font-size:clamp(11px,1.9vh,16px)}
.controls button{padding:clamp(3px,.65vh,8px) clamp(6px,.8vw,13px);line-height:1.2;white-space:nowrap}
.controls label{margin:0;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.controls input[type=range]{width:clamp(62px,9vw,125px);margin:0}
.controls label b{min-width:2.7em;text-align:center}
#dots{flex:0 0 auto;margin:0;gap:5px}
#dots button{font-size:clamp(10px,1.7vh,13px);padding:2px 4px;line-height:1.2}
#s{flex:1 1 0;min-height:0;width:100%;height:100%;display:block}
main>.panel[aria-live]{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto auto;column-gap:16px;align-items:center}
#num{grid-column:1;font-size:clamp(10px,1.5vh,12px)}
#heading{grid-column:1;font-size:clamp(15px,2.5vh,23px);line-height:1.15}
#explain{grid-column:1;font-size:clamp(12px,2vh,17px);line-height:1.3;margin:4px 0 0}
#formula{grid-column:2;grid-row:1/4;min-height:0;padding:4px;font-size:clamp(17px,3.4vh,32px);line-height:1.2;overflow-wrap:anywhere}
main>p{margin:0;line-height:1.15;font-size:clamp(10px,1.5vh,13px)}

@media(max-width:650px){main>.panel[aria-live]{display:block}#formula{padding:3px 0;font-size:clamp(16px,2.8vh,24px)}.controls{gap:4px}.controls input[type=range]{width:65px}}
/* En ventanas excepcionalmente pequeñas o con zoom elevado, preservar acceso a todo. */
@media(max-height:360px),(max-width:340px){main{height:auto;min-height:100vh;grid-template-rows:auto auto auto auto auto}#s{height:auto;min-height:160px}}
.recurso-ayuda-tools .recurso-ayuda-btn{font-size:clamp(11px,1.8vh,14px)!important;padding:4px 9px!important}</style><main><h1>La ley de la reflexión</h1><small>Física · 2.º de Bachillerato | Construcción geométrica de Huygens</small><div class="panel"><div class="controls"><button id="prev">← Anterior</button><button id="next" class="primary">Siguiente →</button><button id="play">▶ Reproducir</button><button id="reset">↺ Reiniciar</button><label>Incidencia: <input id="angle" type="range" min="20" max="65" value="42"><b id="av">42°</b></label></div><div id="dots"></div><svg id="s" viewBox="0 0 1000 510" role="img" aria-label="Construcción geométrica de la reflexión"></svg></div><div class="panel" aria-live="polite"><small id="num"></small><div id="heading"></div><p id="explain"></p><div id="formula"></div></div><p><small>Modelo: frente plano, medio 1 homogéneo e isótropo. Se estudia exclusivamente la onda reflejada; no se representa la transmisión al medio 2.</small></p></main><script>
const steps=[['El frente incidente','Un frente de onda plano AB llega a la superficie. A es el primer punto que alcanza la frontera. Los rayos son perpendiculares al frente.',''],['La propagación durante Δt','Mientras B avanza hasta B′, el punto A actúa como foco secundario según el principio de Huygens. Observa cómo crece la onda secundaria.','BB′ = v₁ Δt'],['La envolvente reflejada','Cada punto de la frontera alcanzado por el frente genera una onda secundaria. La tangente común A′B′ constituye el nuevo frente reflejado.','AA′ = v₁ Δt'],['El triángulo incidente ABB′','El triángulo ABB′ es rectángulo en B. El ángulo entre AB y la frontera es igual al ángulo de incidencia i, porque sus lados son respectivamente perpendiculares.','sen i = BB′ / AB′  ⇒  BB′ = AB′ sen i'],['El triángulo reflejado AA′B′','El triángulo AA′B′ es rectángulo en A′: el radio es perpendicular a la tangente. El ángulo entre A′B′ y la frontera es igual al ángulo de reflexión r.','sen r = AA′ / AB′  ⇒  AA′ = AB′ sen r'],['Igualdad de distancias','BB′ y AA′ se recorren durante el mismo intervalo de tiempo en el mismo medio. La rapidez de propagación es idéntica.','AA′ = BB′ = v₁ Δt'],['La deducción matemática','Sustituimos las expresiones de los dos catetos y simplificamos la hipotenusa común AB′.','AB′ sen i = AB′ sen r  ⇒  sen i = sen r'],['Ley de reflexión','Los ángulos se miden respecto a la normal. Como ambos están entre 0° y 90°, la igualdad de sus senos implica la igualdad de los ángulos.','i = r']];
let k=0,p=1,raf=0,timer=0,playing=false;const $=x=>document.getElementById(x),s=$('s');const C={blue:'#1465ac',red:'#c33d39',green:'#16836d',gray:'#778b99',purple:'#8156a4'};function draw(){let a=+$('angle').value*Math.PI/180,si=Math.sin(a),co=Math.cos(a),D=420,A=[290,365],Q=[710,365],B=[290+D*co*co,365-D*si*co],P=[290+D*si*si,365-D*si*co],O=[500,365],R=D*si;let out=`<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect x="0" y="365" width="1000" height="145" fill="#eaf0f4"/><rect x="0" y="0" width="1000" height="365" fill="#f9fcff"/>`;function line(a,b,c,w=2,d='',arrow=false){out+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c}" stroke-width="${w}" ${d?'stroke-dasharray="'+d+'"':''} ${arrow?'marker-end="url(#arr)"':''}/>`}function text(x,y,t,c='#193247',size=18){out+=`<text x="${x}" y="${y}" fill="${c}" font-size="${size}" text-anchor="middle">${t}</text>`}function point(a,t,dx,dy){out+=`<circle cx="${a[0]}" cy="${a[1]}" r="4" fill="#193247"/>`;text(a[0]+dx,a[1]+dy,t)}function poly(arr,c){out+=`<polygon points="${arr.map(x=>x.join(',')).join(' ')}" fill="${c}" opacity=".13"/>`}function arc(x,r,c,w=2){out+=`<path d="M${x-r} 365 A${r} ${r} 0 0 1 ${x+r} 365" fill="none" stroke="${c}" stroke-width="${w}" stroke-dasharray="5 5"/>`}function mark(v,u,w){let norm=x=>{let n=Math.hypot(...x);return x.map(y=>y/n*12)},a=norm([u[0]-v[0],u[1]-v[1]]),b=norm([w[0]-v[0],w[1]-v[1]]);out+=`<polyline points="${v[0]+a[0]},${v[1]+a[1]} ${v[0]+a[0]+b[0]},${v[1]+a[1]+b[1]} ${v[0]+b[0]},${v[1]+b[1]}" fill="none" stroke="#193247" stroke-width="1.5"/>`}
text(93,30,'Medio 1 · n₁');text(93,400,'Medio 2 · n₂');line([30,365],[970,365],'#193247',3);if(k===3)poly([A,B,Q],C.blue);if(k===4)poly([A,P,Q],C.red);line(A,B,C.blue,k===0||k===3?5:2.5);line(A,Q,k>=3?C.purple:'#193247',k===6?5:2);let raystart=[O[0]-si*260,O[1]-co*260];line(raystart,O,C.blue,2.5,'',true);text(raystart[0]-25,raystart[1]-12,'Incidente',C.blue);line([500,55],[500,365],C.gray,1.5,'6 6');text(500,44,'Normal');if(k>=1){let f=k===1?p:1;for(let j=0;j<=8;j++){let u=j/8;if(f>u+.001)arc(A[0]+D*u,R*(f-u),j===0?C.green:'#a9c8c0',j===0?2.5:1)}let b=[B[0]+(Q[0]-B[0])*f,B[1]+(Q[1]-B[1])*f];line(B,b,C.blue,k===1||k===3||k===5?5:2,'',true);if(k===1){let a2=[A[0]+D*f,A[1]];line(a2,b,C.blue,3);text(840,65,'Δt: '+Math.round(f*100)+'%',C.blue)}}if(k>=2){line(A,P,C.green,k===2||k===4||k===5?5:2.5);line(P,Q,C.red,k===2||k===4?5:3);let end=[O[0]+si*260,O[1]-co*260];line(O,end,C.red,2.5,'',true);text(end[0]+28,end[1]-12,'Reflejado',C.red);point(P,'A′',-18,-12);mark(P,A,Q)}if(k>=1)point(Q,'B′',12,26);point(A,'A',-12,26);point(B,'B',15,-14);if(k>=1)mark(B,A,Q);
function angleArc(v,start,end,r,c,t){let pt=z=>[v[0]+r*Math.cos(z),v[1]+r*Math.sin(z)],q=pt(start),z=pt(end);out+=`<path d="M${q.join(' ')} A${r} ${r} 0 0 1 ${z.join(' ')}" stroke="${c}" stroke-width="2.5" fill="none"/>`;let m=(start+end)/2;text(v[0]+(r+18)*Math.cos(m),v[1]+(r+18)*Math.sin(m),t,c,20)}angleArc(O,-Math.PI/2-a,-Math.PI/2,55,C.blue,'i');if(k>=2)angleArc(O,-Math.PI/2,-Math.PI/2+a,55,C.red,'r');if(k>=3)angleArc(A,-a,0,56,C.blue,'i');if(k>=4)angleArc(Q,-Math.PI,-Math.PI+a,56,C.red,'r');if(k===5){text(500,435,'AA′ = BB′',C.green,25)}if(k===7){text(500,435,'i = r = '+$('angle').value+'°','#193247',28)}s.innerHTML=out;}
function show(n){cancelAnimationFrame(raf);k=Math.max(0,Math.min(7,n));p=1;$('num').textContent=`PASO ${k+1} DE 8`;$('heading').textContent=steps[k][0];$('explain').textContent=steps[k][1];$('formula').textContent=steps[k][2];$('prev').disabled=k===0;$('next').disabled=k===7;$('dots').innerHTML=steps.map((_,i)=>`<button class="${i===k?'active':''}" onclick="stop();show(${i})">${i+1}</button>`).join('');if(k===1){let start=performance.now();function frame(now){p=Math.min(1,(now-start)/2500);draw();if(p<1)raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}else draw()}
function stop(){playing=false;clearInterval(timer);$('play').textContent='▶ Reproducir'}$('prev').onclick=()=>{stop();show(k-1)};$('next').onclick=()=>{stop();show(k+1)};$('reset').onclick=()=>{stop();show(0)};$('play').onclick=()=>{if(playing){stop();return}if(k===7)show(0);playing=true;$('play').textContent='Ⅱ Pausar';timer=setInterval(()=>{if(k===7)stop();else show(k+1)},5500)};$('angle').oninput=()=>{$('av').textContent=$('angle').value+'°';draw()};document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'){stop();show(k+1)}if(e.key==='ArrowLeft'){stop();show(k-1)}});show(0);

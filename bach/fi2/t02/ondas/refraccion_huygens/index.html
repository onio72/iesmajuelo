<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ley de refracción · Huygens</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#193247;font:17px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:22px}h1{font-size:clamp(24px,3vw,36px);margin:0 0 6px}p{line-height:1.5;margin:8px 0}small{color:#526779}.panel{background:white;border:1px solid #d5e0e8;border-radius:14px;padding:16px;margin-top:14px}svg{width:100%;height:auto;display:block}button{font:inherit;border:1px solid #b6c9d8;border-radius:8px;background:white;color:#193247;padding:10px 16px;cursor:pointer}button.primary{background:#175a86;color:white;border-color:#175a86}button:disabled{opacity:.35;cursor:default}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.controls label{margin-left:auto}input{vertical-align:middle;accent-color:#175a86}#formula{font-size:clamp(20px,3vw,32px);font-family:Georgia,serif;text-align:center;padding:12px;color:#153e60;min-height:60px}#dots{display:flex;gap:6px;margin:12px 0}#dots button{flex:1;padding:5px;font-size:13px}#dots .active{background:#175a86;color:white}#heading{font-size:23px;font-weight:700}svg text{font-family:system-ui,sans-serif;paint-order:stroke;stroke:white;stroke-width:4px;stroke-linejoin:round} @media(max-width:600px){main{padding:10px}.controls label{margin-left:0}button{padding:8px}} </style><main><h1>La ley de la refracción</h1><small>Física · 2.º de Bachillerato | Construcción geométrica de Huygens</small><div class="panel"><div class="controls"><button id="prev">← Anterior</button><button id="next" class="primary">Siguiente →</button><button id="play">▶ Reproducir</button><button id="reset">↺ Reiniciar</button><label>Incidencia: <input id="angle" type="range" min="20" max="65" value="42"><b id="av">42°</b></label><label>n₁: <input id="n1" type="range" min="1" max="2" step=".05" value="1"><b id="n1v">1</b></label><label>n₂: <input id="n2" type="range" min="1" max="2.5" step=".05" value="1.5"><b id="n2v">1,5</b></label></div><div id="dots"></div><svg id="s" viewBox="0 0 1000 510" role="img" aria-label="Construcción geométrica de la refracción"></svg></div><div class="panel" aria-live="polite"><small id="num"></small><div id="heading"></div><p id="explain"></p><div id="formula"></div></div><p><small>Modelo: frente plano, medio 1 homogéneo e isótropo. Ambos medios son homogéneos e isótropos. Se estudia exclusivamente la onda refractada; se omite la reflexión.</small></p></main><script>
const steps=[
['El frente incidente','El frente plano AB llega a la frontera. A es el primer punto en alcanzarla. Los rayos son perpendiculares al frente.',''],
['Propagación durante Δt','Mientras B avanza hasta B′ por el medio 1, A y los sucesivos puntos de la frontera emiten ondas secundarias hacia el medio 2.','BB′ = v₁ Δt'],
['La envolvente refractada','La tangente común a las ondas secundarias es el frente refractado A′B′. El radio AA′ es perpendicular al nuevo frente.','AA′ = v₂ Δt'],
['Triángulo incidente ABB′','El triángulo es rectángulo en B. El ángulo entre AB y AB′ coincide con el ángulo de incidencia i.','sen i = BB′ / AB′'],
['Triángulo refractado AA′B′','El triángulo es rectángulo en A′. El ángulo entre A′B′ y la frontera coincide con el ángulo de refracción r.','sen r = AA′ / AB′'],
['Dividimos las expresiones','Ambos triángulos tienen la misma hipotenusa AB′, que se simplifica al dividir las dos expresiones.','sen i / sen r = BB′ / AA′'],
['Sustituimos las distancias','Las distancias se recorren en el mismo intervalo Δt, pero con distintas velocidades. Se simplifica Δt.','sen i / sen r = v₁ Δt / (v₂ Δt) = v₁ / v₂'],
['Ley de Snell','Como n₁ = c/v₁ y n₂ = c/v₂, la relación de velocidades equivale a n₂/n₁. La frecuencia permanece constante y cambia la longitud de onda si cambia la velocidad.','n₁ sen i = n₂ sen r']
];
let k=0,p=1,raf=0,timer=0,playing=false;const $=x=>document.getElementById(x),s=$('s');const blue='#1465ac',red='#c33d39',green='#16836d',gray='#778b99',purple='#8156a4';
function draw(){const a=+$('angle').value*Math.PI/180,n1=+$('n1').value,n2=+$('n2').value,q=n1/n2*Math.sin(a),valid=q<=1+1e-10,r=Math.asin(Math.min(1,q)),si=Math.sin(a),co=Math.cos(a),sr=Math.sin(r),cr=Math.cos(r),D=320,Y=290,A=[340,Y],Q=[660,Y],B=[340+D*co*co,Y-D*si*co],P=[340+D*sr*sr,Y+D*sr*cr],O=[500,Y],R=D*q;let out='<defs><marker id="ab" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#1465ac"/></marker><marker id="ar" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#c33d39"/></marker><clipPath id="lower"><rect x="0" y="'+Y+'" width="1000" height="510"/></clipPath></defs><rect width="1000" height="'+Y+'" fill="#f9fcff"/><rect y="'+Y+'" width="1000" height="220" fill="#eaf0f4"/>';
function line(u,v,c,w=2,d='',arrow=''){out+='<line x1="'+u[0]+'" y1="'+u[1]+'" x2="'+v[0]+'" y2="'+v[1]+'" stroke="'+c+'" stroke-width="'+w+'" '+(d?'stroke-dasharray="'+d+'"':'')+' '+(arrow?'marker-end="url(#'+arrow+')"':'')+'/>'}
function text(x,y,t,c='#193247',size=18){out+='<text x="'+x+'" y="'+y+'" fill="'+c+'" font-size="'+size+'" text-anchor="middle">'+t+'</text>'}
function point(u,t,dx,dy){out+='<circle cx="'+u[0]+'" cy="'+u[1]+'" r="4" fill="#193247"/>';text(u[0]+dx,u[1]+dy,t)}
function poly(arr,c){out+='<polygon points="'+arr.map(x=>x.join(',')).join(' ')+'" fill="'+c+'" opacity=".14"/>'}
function arc(x,h,c,w){out+='<path clip-path="url(#lower)" d="M'+(x-h)+' '+Y+' A'+h+' '+h+' 0 0 0 '+(x+h)+' '+Y+'" fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-dasharray="5 5"/>'}
function mark(v,u,w){let norm=x=>{let n=Math.hypot(...x);return x.map(y=>y/n*12)},b=norm([u[0]-v[0],u[1]-v[1]]),c=norm([w[0]-v[0],w[1]-v[1]]);out+='<polyline points="'+[ [v[0]+b[0],v[1]+b[1]],[v[0]+b[0]+c[0],v[1]+b[1]+c[1]],[v[0]+c[0],v[1]+c[1]] ].map(x=>x.join(',')).join(' ')+'" fill="none" stroke="#193247" stroke-width="1.5"/>'}
function angle(v,start,end,h,c,t){let pt=z=>[v[0]+h*Math.cos(z),v[1]+h*Math.sin(z)],u=pt(start),w=pt(end),m=(start+end)/2;out+='<path d="M'+u.join(' ')+' A'+h+' '+h+' 0 0 1 '+w.join(' ')+'" stroke="'+c+'" stroke-width="2" fill="none"/>';text(v[0]+(h+18)*Math.cos(m),v[1]+(h+18)*Math.sin(m),t,c,20)}
text(105,30,'Medio 1 · n₁ = '+n1.toFixed(2).replace('.',','));text(105,330,'Medio 2 · n₂ = '+n2.toFixed(2).replace('.',','));text(105,55,'v₁ = c/n₁',blue);text(105,355,'v₂ = c/n₂',red);
if(k===3)poly([A,B,Q],blue);if(k===4&&valid&&q<.99999)poly([A,P,Q],red);
line([25,Y],[975,Y],'#193247',3);line(A,B,blue,k===0||k===3?5:2.5);line(A,Q,k>=3?purple:'#193247',k===5?5:2);
line([500,50],[500,485],gray,1.5,'6 6');text(500,39,'Normal');let I=[O[0]-si*220,O[1]-co*220];line(I,O,blue,2.5,'','ab');text(I[0]-35,I[1]-15,'Incidente',blue);angle(O,-Math.PI/2-a,-Math.PI/2,47,blue,'i');
if(k>=1){let f=k===1?p:1;for(let j=0;j<=10;j++){let u=j/10;if(f>u+.001)arc(A[0]+D*u,R*(f-u),j===0?green:'#9bbcb7',j===0?2.5:1)}let b=[B[0]+(Q[0]-B[0])*f,B[1]+(Q[1]-B[1])*f];line(B,b,blue,k===1||k===3||k===6?5:2,'','ab');if(k===1){line([A[0]+D*f,Y],b,blue,3);text(850,65,'Δt: '+Math.round(f*100)+'%',blue)}if(f>.999){point(Q,'B′',15,-15);mark(B,A,Q)}}
if(k>=2&&valid&&q<.99999){line(A,P,green,k===2||k===4||k===6?5:2.5);line(P,Q,red,k===2||k===4?5:3);let E=[O[0]+sr*190,O[1]+cr*190];line(O,E,red,2.5,'','ar');text(E[0]+55,E[1]+8,'Refractado',red);point(P,'A′',-17,19);mark(P,A,Q);angle(O,Math.PI/2-r,Math.PI/2,48,red,'r');if(k>=4)angle(Q,Math.PI-r,Math.PI,46,red,'r')}
if(k>=3)angle(A,-a,0,46,blue,'i');point(A,'A',-14,-12);point(B,'B',12,-14);
if(!valid&&k>=2)text(730,465,'Reflexión total: no hay frente refractado propagante',red,17);else if(q>=.99999&&k>=2){line(Q,[950,Y],red,4,'','ar');text(810,320,'Ángulo crítico: r = 90°',red,19)}
if(k===7&&valid)text(810,95,'i = '+$('angle').value+'° · r = '+(r*180/Math.PI).toFixed(1).replace('.',',')+'°',red,24);
s.innerHTML=out;const f=$('formula');f.textContent=!valid&&k>=2?'n₁ sen i > n₂ ⇒ reflexión total interna':q>=.99999&&k>=2?'r = 90° · límite de la construcción no degenerada':steps[k][2];$('explain').textContent=!valid&&k>=2?'No existe una tangente común que produzca un frente transmitido propagante. Reduce i o aumenta n₂ para continuar la demostración geométrica.':q>=.99999&&k>=2?'En el ángulo crítico el frente geométrico degenera y la dirección refractada es tangente a la frontera. Reduce ligeramente el ángulo para ver los triángulos.':steps[k][1];
}
function show(n){cancelAnimationFrame(raf);k=Math.max(0,Math.min(7,n));p=1;$('num').textContent='PASO '+(k+1)+' DE 8';$('heading').textContent=steps[k][0];$('prev').disabled=k===0;$('next').disabled=k===7;$('dots').innerHTML=steps.map((_,i)=>'<button class="'+(i===k?'active':'')+'" onclick="stop();show('+i+')">'+(i+1)+'</button>').join('');if(k===1){let start=performance.now();function frame(now){p=Math.min(1,(now-start)/2500);draw();if(p<1)raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}else draw()}
function stop(){playing=false;clearInterval(timer);$('play').textContent='▶ Reproducir'}$('prev').onclick=()=>{stop();show(k-1)};$('next').onclick=()=>{stop();show(k+1)};$('reset').onclick=()=>{stop();show(0)};$('play').onclick=()=>{if(playing){stop();return}if(k===7)show(0);playing=true;$('play').textContent='Ⅱ Pausar';timer=setInterval(()=>{if(k===7)stop();else show(k+1)},6500)};for(const id of ['angle','n1','n2'])$(id).oninput=()=>{$('av').textContent=$('angle').value+'°';for(const n of ['n1','n2'])$(n+'v').textContent=(+$(n).value).toFixed(2).replace('.',',');draw()};document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'){stop();show(k+1)}if(e.key==='ArrowLeft'){stop();show(k-1)}});show(0);
</script></html>

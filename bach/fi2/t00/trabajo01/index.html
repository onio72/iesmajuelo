<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trabajo mecánico: medida gráfica de vectores · v14</title></head><body><script>window.__SCORM_GZ=[];</script>
<script src="payload_00.js"></script>
<script src="payload_01.js"></script>
<script>(async function(){try{const b64=window.__SCORM_GZ.join('');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('Este navegador no admite descompresión gzip.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<p style="font-family:sans-serif;padding:2rem">No se pudo cargar la actividad: '+String(e.message||e)+'</p>';}})();</script></body></html>

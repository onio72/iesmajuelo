<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagramas de fuerzas - práctica adaptativa</title>
</head>
<body>
<p id="loading" style="font-family:system-ui;padding:1rem">Cargando actividad…</p>
<script>
(async()=>{
  try{
    const r=await fetch('./app.html',{cache:'no-store'});
    if(!r.ok) throw new Error('No se pudo cargar app.html');
    let html=await r.text();
    const css=`
#force-bayes-app .fa-prompt{font-size:clamp(1.35rem,1.18rem + .55vw,1.85rem)!important;line-height:1.35!important;font-weight:700!important;padding:.9rem 1.05rem!important;margin:0 0 .55rem!important;border-left:.35rem solid var(--primary)!important;border-radius:.7rem!important;background:color-mix(in srgb,var(--accent) 58%,var(--background))!important}
#force-bayes-app .fa-data{font-size:clamp(1.05rem,.98rem + .28vw,1.32rem)!important;line-height:1.45!important;font-weight:600!important;margin:0 0 1rem!important;color:var(--foreground)!important}
#force-bayes-app .fa-step-title{font-size:clamp(1.12rem,1.02rem + .32vw,1.38rem)!important;line-height:1.35!important;font-weight:700!important;margin-bottom:.85rem!important}
#force-bayes-app .fa-workspace{grid-template-columns:minmax(0,1.4fr) minmax(20rem,.95fr)!important;gap:1.15rem!important}
#force-bayes-app .fa-panel{border-left:2px solid var(--border)!important;padding-left:1.15rem!important}
#force-bayes-app .fa-force-grid{gap:.7rem!important;margin-bottom:1rem!important}
#force-bayes-app .fa-force-option{font-size:clamp(1.05rem,1rem + .22vw,1.28rem)!important;line-height:1.3!important;font-weight:600!important;gap:.7rem!important;min-height:3.5rem!important;padding:.72rem .82rem!important;border:2px solid var(--border)!important;border-radius:.8rem!important;background:color-mix(in srgb,var(--card) 80%,var(--background))!important;cursor:pointer!important}
#force-bayes-app .fa-force-option:hover{border-color:var(--foreground)!important;background:color-mix(in srgb,var(--accent) 55%,var(--background))!important}
#force-bayes-app .fa-force-option:has(.form-check-input:checked){border-color:var(--primary)!important;background:color-mix(in srgb,var(--accent) 82%,var(--background))!important;box-shadow:inset 0 0 0 1px var(--primary)!important}
#force-bayes-app .fa-force-option .form-check-input{width:1.35rem!important;height:1.35rem!important;min-width:1.35rem!important}
#force-bayes-app .fa-force-option .fa-force-swatch{width:1.05rem!important;height:1.05rem!important;border-width:2px!important}
#force-bayes-app .fa-force-name{overflow-wrap:normal!important;word-break:normal!important}
#force-bayes-app .fa-force-button{font-size:clamp(1rem,.95rem + .18vw,1.2rem)!important;font-weight:600!important;min-height:2.85rem!important;padding:.35rem .75rem!important;gap:.55rem!important}
#force-bayes-app .fa-force-button .fa-force-swatch{width:1rem!important;height:1rem!important;border-width:2px!important}
#force-bayes-app #fa-confirm-forces{font-size:1.05rem!important;min-height:2.8rem!important;padding:0 1rem!important;font-weight:650!important}
@media (max-width:900px){#force-bayes-app .fa-workspace{grid-template-columns:minmax(0,1.25fr) minmax(18rem,1fr)!important}}
@media (max-width:720px){#force-bayes-app .fa-workspace{grid-template-columns:1fr!important}#force-bayes-app .fa-panel{border-left:0!important;border-top:2px solid var(--border)!important;padding-left:0!important;padding-top:1rem!important}}
@media (max-width:520px){#force-bayes-app .fa-force-grid{grid-template-columns:1fr!important}#force-bayes-app .fa-prompt{font-size:1.22rem!important}#force-bayes-app .fa-data{font-size:1rem!important}}
`;
    html=html.replace('</body>',`<style id="projection-readability">${css}</style></body>`);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    document.body.innerHTML='<p style="font-family:system-ui;padding:1rem;color:#991b1b">No se pudo cargar la actividad.</p>';
  }
})();
</script>
</body>
</html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --secondary: #64748b;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --radius: 0.75rem;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header & Navigation */
        header {
            background: white;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem;
        }
        .header-content {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .brand {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .search-container {
            position: relative;
            flex: 1;
            max-width: 400px;
        }
        .search-input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border-radius: 2rem;
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
            background: var(--bg-body);
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
        }

        /* Toolbar / Breadcrumbs */
        .toolbar {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1rem;
        }
        .toolbar-content {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .btn-back {
            background: white;
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s;
            color: var(--text-muted);
        }
        .btn-back:hover {
            background: var(--primary-light);
            color: var(--primary);
            border-color: var(--primary);
        }
        .breadcrumbs {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.4rem;
            align-items: center;
            overflow-x: auto;
            white-space: nowrap;
        }
        .breadcrumb-item { cursor: pointer; transition: color 0.2s; }
        .breadcrumb-item:hover { color: var(--primary); }
        .breadcrumb-sep { opacity: 0.3; font-weight: 300; }

        /* Main Content */
        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .view-container {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .card {
            background: var(--bg-card);
            padding: 2rem 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }
        .card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .card:hover::after { opacity: 1; }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 1.25rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Resource Groups */
        .resource-section-title {
            margin: 2rem 0 1rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }
        .resource-group {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
        }
        .resource-group h3 {
            margin-bottom: 1rem;
            color: var(--primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.75rem;
        }
        .link-item {
            display: flex;
            align-items: center;
            padding: 0.8rem 1rem;
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 0.6rem;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .link-item:hover {
            background: white;
            border-color: var(--primary);
            color: var(--primary);
            transform: translateX(3px);
            box-shadow: var(--shadow-sm);
        }
        .link-item::before {
            content: '🔗';
            margin-right: 10px;
            font-size: 1rem;
            filter: grayscale(1);
        }
        .link-item:hover::before { filter: grayscale(0); }

        /* Search Results View */
        .search-results-info {
            padding: 1rem;
            margin-bottom: 1rem;
            background: var(--primary-light);
            border-radius: var(--radius);
            font-size: 0.9rem;
            color: var(--primary-dark);
        }
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .hidden { display: none !important; }

        footer {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            background: white;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .header-content { flex-direction: column; align-items: flex-start; }
            .search-container { max-width: 100%; width: 100%; }
            .grid { grid-template-columns: 1fr; }
            .links-grid { grid-template-columns: 1fr; }
            .brand { font-size: 1rem; }
        }

        /* Navegación compacta de Física 2.º Bachillerato */
        .fi2-accordion { display:grid; gap:.8rem; }
        .fi2-topic { border:1px solid var(--border); border-radius:.75rem; background:white; overflow:hidden; box-shadow:var(--shadow-sm); }
        .fi2-topic > summary { list-style:none; display:flex; align-items:center; justify-content:space-between; gap:1rem; cursor:pointer; padding:1.08rem 1.25rem; font-weight:750; font-size:1.05rem; color:var(--text-main); }
        .fi2-topic > summary::-webkit-details-marker, .fi2-section > summary::-webkit-details-marker { display:none; }
        .fi2-topic > summary::after, .fi2-section > summary::after { content:'+'; font:600 1.5rem/1 system-ui; color:var(--primary); flex:none; }
        .fi2-topic[open] > summary::after, .fi2-section[open] > summary::after { content:'−'; }
        .fi2-topic[open] > summary { color:var(--primary); background:var(--primary-light); border-bottom:1px solid var(--border); }
        .fi2-topic-body { padding:1rem; display:grid; gap:.65rem; }
        .fi2-section { border:1px solid var(--border); border-radius:.6rem; background:var(--bg-body); overflow:hidden; }
        .fi2-section > summary { list-style:none; display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.8rem 1rem; cursor:pointer; font-size:.95rem; font-weight:650; }
        .fi2-section[open] > summary { color:var(--primary); background:white; border-bottom:1px solid var(--border); }
        .fi2-section .links-grid { padding:.75rem; gap:.65rem; }
        .fi2-topic summary:focus-visible, .fi2-section summary:focus-visible { outline:3px solid var(--primary); outline-offset:-3px; }
        .fi2-count { font-size:.77rem; font-weight:500; color:var(--text-muted); margin-left:auto; text-align:right; }
        @media(max-width:600px) { .fi2-topic > summary { padding:.95rem 1rem; font-size:.98rem; } .fi2-topic-body { padding:.7rem; } .fi2-count { font-size:.7rem; } }

        /* Segunda navegación FI2; no modifica los estilos de la vista temática. */
        .fi2-view-switch { display:flex; gap:.4rem; flex-wrap:wrap; margin:0 0 1.2rem; padding:.3rem; width:max-content; max-width:100%; background:#eaf0f7; border-radius:.7rem; }
        .fi2-view-switch button { border:0; border-radius:.5rem; padding:.65rem 1rem; font:600 .9rem Inter,sans-serif; background:transparent; color:#42566b; cursor:pointer; }
        .fi2-view-switch button[aria-pressed="true"] { background:#fff; color:#1d4ed8; box-shadow:0 1px 4px #0f172a20; }
        .fi2-view-switch button:focus-visible { outline:3px solid #bf7b18; outline-offset:2px; }
        .fi2-view-description { color:var(--text-muted); font-size:.9rem; margin:0 0 1.1rem; }
    </style>
</head>

                     { name: "Crea gráfico de barras(I)", url: "https://onio72.github.io/iesmajuelo/fpb2/t05/grafbarras01/" },
                     { name: "Crea gráfico de barras(II)", url: "https://onio72.github.io/iesmajuelo/fpb2/t05/grafbarras02/" },
                     { name: "Crea gráfico de barras(III)", url: "https://onio72.github.io/iesmajuelo/fpb2/t05/grafbarras03/" },
                     { name: "Cálculo de media, mediana y moda", url: "https://onio72.github.io/iesmajuelo/fpb2/t05/calculommm/" }
                 ]}
             ] 
         },
        tools: { title: "Herramientas", groups: [{ name: "Simuladores", links: [{ name: "Dibuja átomos", url: "https://onio72.github.io/iesmajuelo/tools/atomo.html" }] }] },
        cdd: { title: "CDD", groups: [{ name: "Digital", links: [{ name: "Repositorio de píldoras", url: "https://onio72.github.io/cdd/" }] }] },
        equipo: { 
            title: "Equipo Directivo", 
            groups: [
                { name: "Gestión", links: [
                    { name: "Calendario", url: "https://onio72.github.io/ed/calendario.html" },
                    { name: "Flujos de trabajo", url: "https://onio72.github.io/ed/flujo/index.html" },
                    { name: "Generador respuestas revisiones", url: "https://script.google.com/a/macros/iesmajuelo.com/s/AKfycbyKsDuK9ZlufrAoR_tZ-ALkH7Y6w4-yXOls2Rrod2jBsG4kpBNuRpnC_wxIvw9gQGX2/exec" }
                ]}
            ] 
        },
        departamento: { title: "Departamento", groups: [{ name: "Organización", links: [{ name: "Reparto materias", url: "https://onio72.github.io/iesmajuelo/departamentoFQ/reparto/" }, { name: "Evaluando por competencias", url: "https://onio72.github.io/iesmajuelo/departamentoFQ/evalcomp/index.html" }] }] },
        otros: { title: "Otros", groups: [{ name: "Varios", links: [{ name: "Bingo viajero", url: "https://onio72.github.io/bingo/" }] }] }
    };

    const ROOT_PATH = '/iesmajuelo/';
    const SECTION_PATHS = {
        root: '', eso:'eso', bach:'bach', fq2:'eso/fq2', fq3:'eso/fq3',
        fq4:'eso/fq4', fq1:'bach/fq1', fi2:'bach/fi2',
        fpb2:'fpb2', tools:'tools', cdd:'cdd', equipo:'equipo',
        departamento:'departamento', otros:'otros'
    };
    const PARENT = {eso:'root',bach:'root',fq2:'eso',fq3:'eso',fq4:'eso',
        fq1:'bach',fi2:'bach',fpb2:'root',tools:'root',cdd:'root',
        equipo:'root',departamento:'root',otros:'root'};
    let navigationStack = ['root'];
    let isSearchActive = false;
    let fi2View = 'temas';
    let fi2CatalogError = '';
    function sectionUrl(id) { return ROOT_PATH + (SECTION_PATHS[id] ? SECTION_PATHS[id]+'/' : ''); }
    function stackFor(id) {
        const stack = [];
        while(id && DATA[id]) { stack.unshift(id); id=PARENT[id]; }
        if(stack[0]!=='root')stack.unshift('root');
        return stack;
    }
    function readSectionFromUrl() {
        const path=decodeURIComponent(location.pathname);
        const parts=path.split('/').filter(Boolean);
        if(parts[0]!=='iesmajuelo') return 'root';
        const relative=parts.slice(1).join('/');
        return Object.keys(SECTION_PATHS).find(id=>SECTION_PATHS[id]===relative) || 'root';
    }
    function setSection(id, mode='push') {
        if (!DATA[id]) return;
        document.getElementById('searchInput').value='';
        isSearchActive=false;
        navigationStack=stackFor(id);
        const target=sectionUrl(id);
        if(mode==='push' && location.pathname!==target)history.pushState({section:id},'',target);
        if(mode==='replace' && location.pathname!==target)history.replaceState({section:id},'',target);
        render();
    }
    function navigateTo(id) { setSection(id); }
    function goBack() {
        if(navigationStack.length>1)setSection(navigationStack[navigationStack.length-2]);
    }
    window.addEventListener('popstate',()=>{
        navigationStack=stackFor(readSectionFromUrl());
        isSearchActive=false;
        document.getElementById('searchInput').value='';
        render();
    });

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        const app = document.getElementById('app');
        const backBtn = document.getElementById('backBtn');
        const breadcrumbs = document.getElementById('breadcrumbs');

        if (query.length < 2) {
            isSearchActive = false;
            render();
            return;
        }

        isSearchActive = true;
        backBtn.classList.remove('hidden');
        breadcrumbs.innerHTML = `Resultados de: <strong>${query}</strong>`;
        
        const results = [];
        
        // Buscar en todo el objeto DATA
        Object.keys(DATA).forEach(key => {
            const node = DATA[key];
            if (node.groups) {
                node.groups.forEach(group => {
                    (group.sections ? group.sections.flatMap(section => section.links.map(link => ({ ...link, subgroup: section.name }))) : group.links).forEach(link => {
                        if (link.name.toLowerCase().includes(query) || group.name.toLowerCase().includes(query)) {
                            results.push({ ...link, category: node.title, group: link.subgroup ? group.name + ' › ' + link.subgroup : group.name });
                        }
                    });
                });
            }
        });

        let html = `<div class="view-container">`;

        if (results.length > 0) {
            html += `<div class="search-results-info">Se han encontrado ${results.length} recursos</div>`;
            html += `<div class="links-grid">`;
            results.forEach(res => {
                html += `
                    <a href="${res.url}" class="link-item" target="_blank">
                        <div style="display:flex; flex-direction:column">
                            <span>${res.name}</span>
                            <small style="font-size:0.7rem; opacity:0.6">${res.category} › ${res.group}</small>
                        </div>
                    </a>
                `;
            });
            html += `</div>`;
        } else {
            html += `<div class="no-results">
                <div style="font-size: 3rem; margin-bottom: 1rem">🔍</div>
                <p>No se encontraron recursos que coincidan con "${query}"</p>
            </div>`;
        }
        
        html += `</div>`;
        app.innerHTML = html;
    }



    const FI2_DIDACTIC_TYPES = [
        { id:'guiado', name:'Aprendizaje guiado', description:'Itinerarios de descubrimiento y construcción progresiva del conocimiento.' },
        { id:'practica', name:'Práctica y evaluación interactiva', description:'Ejercicios, retos y cuestionarios con comprobación de respuestas.' },
        { id:'simulacion', name:'Simulaciones y visualizaciones conceptuales', description:'Exploración de fenómenos físicos y de las relaciones entre magnitudes.' },
        { id:'deduccion', name:'Deducciones y desarrollos matemáticos', description:'Explicaciones paso a paso y construcción de ecuaciones.' },
        { id:'laboratorio', name:'Laboratorios virtuales y herramientas científicas', description:'Experimentación, registro de medidas y elaboración de representaciones.' }
    ];
    async function loadFi2Catalog() {
        const response = await fetch('/iesmajuelo/bach/fi2/recursos.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const catalog = await response.json();
        if (catalog.version !== 1 || !Array.isArray(catalog.groups)) throw new Error('Formato de catálogo no reconocido');
        const validTypes = new Set(FI2_DIDACTIC_TYPES.map(type => type.id));
        const urls = new Set();
        let count = 0;
        for (const group of catalog.groups) {
            if (!group || typeof group.name !== 'string') throw new Error('Grupo inválido');
            if (Array.isArray(group.links) === Array.isArray(group.sections)) throw new Error('Estructura de grupo incorrecta');
            const sections = group.sections || [{ name: group.name, links: group.links }];
            for (const section of sections) {
                if (!Array.isArray(section.links)) throw new Error('Sección sin enlaces');
                for (const link of section.links) {
                    if (typeof link.name !== 'string' || !link.name.trim() ||
                        typeof link.url !== 'string' || !link.url.startsWith('https://onio72.github.io/iesmajuelo/bach/fi2/') ||
                        !validTypes.has(link.didactica) || urls.has(link.url)) {
                        throw new Error('Recurso inválido o duplicado: ' + (link && link.name || '(sin nombre)'));
                    }
                    urls.add(link.url);
                    count++;
                }
            }
        }
        if (count === 0) throw new Error('Catálogo vacío');
        DATA.fi2.groups = catalog.groups;
    }

    function switchFi2View(next) {
        if (next !== 'temas' && next !== 'funciones') return;
        fi2View = next;
        render();
    }
    function renderFi2ViewSelector() {
        return '<div class="fi2-view-switch" role="group" aria-label="Clasificación de los recursos">'+
            '<button type="button" aria-pressed="'+(fi2View==='temas')+'" onclick="switchFi2View(\'temas\')">Por temas</button>'+
            '<button type="button" aria-pressed="'+(fi2View==='funciones')+'" onclick="switchFi2View(\'funciones\')">Por función didáctica</button>'+
            '</div>';
    }
    function renderFi2DidacticAccordion(groups) {
        const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const all = groups.flatMap(group => group.sections ? group.sections.flatMap(section => section.links) : (group.links || []));
        return '<p class="fi2-view-description">Los mismos '+all.length+' enlaces, organizados según su función didáctica predominante.</p>'+
            '<div class="fi2-accordion">'+FI2_DIDACTIC_TYPES.map((type,i) => {
                const links=all.filter(link => link.didactica===type.id);
                return '<details class="fi2-topic" data-fi2-topic="'+i+'">'+
                    '<summary><span>'+escapeHtml(type.name)+'</span><span class="fi2-count">'+links.length+' recursos</span></summary>'+
                    '<div class="fi2-topic-body"><p class="fi2-view-description">'+escapeHtml(type.description)+'</p>'+
                    '<div class="links-grid">'+links.map(link =>
                        '<a href="'+escapeHtml(link.url)+'" class="link-item" target="_blank" rel="noopener">'+escapeHtml(link.name)+'</a>'
                    ).join('')+'</div></div></details>';
            }).join('')+'</div>';
    }

    function renderFi2Accordion(groups) {
        // La lista DATA es la fuente de verdad; no se cambian nombres, enlaces ni el orden de los recursos.
        const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const sectionsFor = group => {
            if (group.sections) return group.sections;
            if (group.name === 'Vibraciones y ondas') {
                const firstWaveIndex = group.links.findIndex(link => link.name === 'Principio de Huygens');
                const boundary = firstWaveIndex >= 0 ? firstWaveIndex : group.links.length;
                return [
                    { name:'Movimiento armónico simple', links:group.links.slice(0,boundary) },
                    { name:'Ondas', links:group.links.slice(boundary) }
                ];
            }
            return [{ name:'Recursos del tema', links:group.links || [] }];
        };
        const headings = {
            'Campo gravitatorio':'Tema 1 · Campo gravitatorio',
            'Vibraciones y ondas':'Tema 2 · Vibraciones y ondas',
            'Interacción electromagnética':'Tema 3 · Interacción electromagnética'
        };
        return '<div class="fi2-accordion">'+groups.map((group,i) => {
            const sections=sectionsFor(group);
            const total=sections.reduce((sum,section)=>sum+section.links.length,0);
            return '<details class="fi2-topic" data-fi2-topic="'+i+'">'+
                '<summary><span>'+escapeHtml(headings[group.name]||group.name)+'</span><span class="fi2-count">'+total+' recursos</span></summary>'+
                '<div class="fi2-topic-body">'+sections.map((section,j) =>
                    '<details class="fi2-section" data-fi2-section="'+j+'"><summary><span>'+escapeHtml(section.name)+'</span><span class="fi2-count">'+section.links.length+' recursos</span></summary>'+
                    '<div class="links-grid">'+section.links.map(link =>
                        '<a href="'+escapeHtml(link.url)+'" class="link-item" target="_blank" rel="noopener">'+escapeHtml(link.name)+'</a>'
                    ).join('')+'</div></details>'
                ).join('')+'</div></details>';
        }).join('')+'</div>';
    }
    function enableFi2Accordion() {
        const root=document.querySelector('.fi2-accordion');
        if(!root)return;
        root.addEventListener('toggle', event => {
            const item=event.target;
            if(!(item instanceof HTMLDetailsElement)||!item.open)return;
            if(item.classList.contains('fi2-topic')) {
                root.querySelectorAll('.fi2-topic').forEach(other=>{if(other!==item)other.open=false});
            } else if(item.classList.contains('fi2-section')) {
                item.parentElement.querySelectorAll('.fi2-section').forEach(other=>{if(other!==item)other.open=false});
            }
        },true);
    }

    function render() {
        if (isSearchActive) return;

        const app = document.getElementById('app');
        const backBtn = document.getElementById('backBtn');
        const breadcrumbs = document.getElementById('breadcrumbs');
        const currentId = navigationStack[navigationStack.length - 1];
        const currentData = DATA[currentId];

        // Update Breadcrumbs
        if (currentId === 'root') {
            backBtn.classList.add('hidden');
            breadcrumbs.innerHTML = '<span class="breadcrumb-item">Inicio</span>';
        } else {
            backBtn.classList.remove('hidden');
            let bHtml = '';
            navigationStack.forEach((id, index) => {
                bHtml += `<span class="breadcrumb-item" onclick="jumpToStack(${index})">${DATA[id].title}</span>`;
                if (index < navigationStack.length - 1) {
                    bHtml += `<span class="breadcrumb-sep">/</span>`;
                }
            });
            breadcrumbs.innerHTML = bHtml;
        }

        let html = `<div class="view-container">`;
        
        if (currentData.items) {
            html += `<div class="grid">`;
            currentData.items.forEach(item => {
                html += `
                    <div class="card" onclick="${item.url ? `window.open('${item.url}','_self')` : `navigateTo('${item.id}')`}">
                        <div class="card-icon">${item.icon}</div>
                        <h2>${item.title}</h2>
                        <p>${item.desc || ''}</p>
                    </div>
                `;
            });
            html += `</div>`;
        } else if (currentData.groups) {
            html += `<h1 class="resource-section-title">${currentData.title}</h1>`;
            if (currentId === 'fi2') {
                if (fi2CatalogError) {
                    html += '<p class="no-results" role="alert">No se ha podido cargar el catálogo de recursos. No se ha modificado ningún enlace. Detalle: '+fi2CatalogError+'</p>';
                } else {
                    html += renderFi2ViewSelector();
                    html += fi2View === 'temas' ? renderFi2Accordion(currentData.groups) : renderFi2DidacticAccordion(currentData.groups);
                }
            } else {
            currentData.groups.forEach(group => {
                html += `
                    <div class="resource-group">
                        <h3><span>📂</span> ${group.name}</h3>
                        ${group.sections ? group.sections.map(section => `
                            <div class="resource-subgroup">
                                <h4 style="margin:1.25rem 0 .65rem;font-size:1rem;color:var(--primary);font-weight:700;">${section.name}</h4>
                                <div class="links-grid">
                                    ${section.links.map(link => `<a href="${link.url}" class="link-item" target="_blank" rel="noopener">${link.name}</a>`).join('')}
                                </div>
                            </div>
                        `).join('') : `
                            <div class="links-grid">
                                ${group.links.map(link => `<a href="${link.url}" class="link-item" target="_blank" rel="noopener">${link.name}</a>`).join('')}
                            </div>
                        `}
                    </div>
                `;
            });
            }
        }
        
        html += `</div>`;
        app.innerHTML = html;
        if(currentId === 'fi2')enableFi2Accordion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpToStack(index) {
        setSection(navigationStack[index]);
    }

    window.onload = async () => {
        try {
            await loadFi2Catalog();
        } catch (error) {
            console.error('Error al cargar recursos FI2:', error);
            fi2CatalogError = String(error && error.message || error).replace(/[<>&"']/g, '');
        }
        setSection(readSectionFromUrl(), 'replace');
    };
</script>
</body>
</html>

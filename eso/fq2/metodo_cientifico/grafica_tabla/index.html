<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>De gráfica a tabla · 2.º ESO</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#657084;--blue:#2457d6;--green:#168447;--red:#c73737;--line:#d8deea}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.badge{background:#e9efff;color:#244eb1;padding:6px 10px;border-radius:999px;font-weight:700;font-size:13px}
h1{margin:6px 0 4px;font-size:clamp(25px,4vw,38px)}.sub{color:var(--muted);margin:0}.score{text-align:right;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:130px}.score b{font-size:28px}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-top:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
canvas{width:100%;height:auto;display:block}.q{margin-bottom:14px}.q label{display:block;font-weight:700;margin-bottom:6px}
select,input{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:9px;background:white}select.ok,input.ok{border-color:var(--green);background:#eefaf3}select.ko,input.ko{border-color:var(--red);background:#fff0f0}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{border:1px solid var(--line);padding:8px;text-align:center}th{background:#f3f5f9}td input{min-width:60px;text-align:center}
button{font:inherit;font-weight:750;border:0;border-radius:10px;padding:12px 16px;cursor:pointer}.primary{background:var(--blue);color:white;width:100%}.next{background:#eef2ff;color:#244eb1;width:100%;margin-top:10px}.feedback{margin-top:12px;padding:12px;border-radius:10px;background:#f3f5f9}.hidden{display:none}.mini{font-size:13px;color:var(--muted)}
@media(max-width:760px){.grid{grid-template-columns:1fr}.top{flex-direction:column}.score{text-align:left}}
</style>
</head>
<body><main>
<div class="top"><div><span class="badge">Física y Química · 2.º ESO</span><h1>De gráfica a tabla</h1><p class="sub">Lee la gráfica, identifica las variables y completa los datos.</p></div><div class="score"><span class="mini">Nota</span><br><b id="score">0,0</b> / 10<br><span id="perfects" class="mini">0 / 4 perfectos</span></div></div>
<div class="grid"><section class="card"><div style="display:flex;justify-content:space-between"><b id="round">Intento 1</b><span class="mini">4 perfectos = 10</span></div><canvas id="chart" width="650" height="470"></canvas></section>
<section class="card"><form id="form">
<div class="q"><label for="ind">Variable independiente</label><select id="ind"></select></div>
<div class="q"><label for="dep">Variable dependiente</label><select id="dep"></select></div>
<div class="q"><label for="tind">La variable independiente es una magnitud…</label><select id="tind"><option value="">Sin responder</option><option value="Fundamental">Fundamental</option><option value="Derivada">Derivada</option></select></div>
<div class="q"><label for="tdep">La variable dependiente es una magnitud…</label><select id="tdep"><option value="">Sin responder</option><option value="Fundamental">Fundamental</option><option value="Derivada">Derivada</option></select></div>
<div class="q"><label for="uind">Unidad de la variable independiente</label><select id="uind"></select></div>
<div class="q"><label for="udep">Unidad de la variable dependiente</label><select id="udep"></select></div>
<div class="q"><label>Completa los huecos leyendo los puntos de la gráfica</label><div style="overflow-x:auto"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div>
<button class="primary" type="submit">Comprobar</button><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="next hidden" type="button">Otro ejercicio</button>
</form></section></div></main>
<script>
(()=>{
const cases=[
{x:'Tiempo',xu:'s',y:'Distancia',yu:'m',xs:[0,2,4,6,8,10],ys:[0,4,8,12,16,20]},
{x:'Tiempo',xu:'min',y:'Temperatura',yu:'°C',xs:[0,2,4,6,8,10],ys:[20,24,28,32,36,40]},
{x:'Masa',xu:'g',y:'Volumen',yu:'cm³',xs:[0,10,20,30,40,50],ys:[0,5,10,15,20,25]},
{x:'Tiempo',xu:'s',y:'Velocidad',yu:'m/s',xs:[0,1,2,3,4,5],ys:[0,3,6,9,12,15]},
{x:'Longitud',xu:'cm',y:'Masa',yu:'g',xs:[0,2,4,6,8,10],ys:[0,6,12,18,24,30]},
{x:'Volumen',xu:'L',y:'Masa',yu:'kg',xs:[0,1,2,3,4,5],ys:[0,2,4,6,8,10]}
];
const vars=['Tiempo','Distancia','Temperatura','Masa','Volumen','Velocidad','Longitud'];
const units=['s','min','m','cm','g','kg','L','cm³','°C','m/s'];
const fundamental=new Set(['Tiempo','Distancia','Temperatura','Masa','Longitud']);
const tipo=m=>fundamental.has(m)?'Fundamental':'Derivada';
let c,holes=[],perfect=0,round=1,firstCheck=true,last=-1;
const $=id=>document.getElementById(id), shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function setOpts(id,correct,pool){const el=$(id);const a=shuffle([correct,...shuffle(pool.filter(v=>v!==correct)).slice(0,3)]);el.innerHTML='<option value="">Sin responder</option>'+a.map(v=>'<option value="'+v+'">'+v+'</option>').join('')}
function draw(){const cv=$('chart'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,L=80,R=28,T=30,B=72,w=W-L-R,h=H-T-B,maxX=Math.max(...c.xs),minY=Math.min(0,...c.ys),maxY=Math.max(...c.ys);ctx.clearRect(0,0,W,H);ctx.font='15px system-ui';ctx.fillStyle='#172033';ctx.strokeStyle='#d8deea';ctx.lineWidth=1;
for(let i=0;i<c.xs.length;i++){let x=L+c.xs[i]/maxX*w;ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,T+h);ctx.stroke();ctx.textAlign='center';ctx.fillText(c.xs[i],x,T+h+25)}
for(let i=0;i<c.ys.length;i++){let y=T+h-(c.ys[i]-minY)/(maxY-minY)*h;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(L+w,y);ctx.stroke();ctx.textAlign='right';ctx.fillText(c.ys[i],L-12,y+5)}
ctx.strokeStyle='#172033';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+h);ctx.lineTo(L+w,T+h);ctx.stroke();
ctx.strokeStyle='#2457d6';ctx.fillStyle='#2457d6';ctx.lineWidth=3;ctx.beginPath();c.xs.forEach((v,i)=>{let x=L+v/maxX*w,y=T+h-(c.ys[i]-minY)/(maxY-minY)*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();c.xs.forEach((v,i)=>{let x=L+v/maxX*w,y=T+h-(c.ys[i]-minY)/(maxY-minY)*h;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()});
ctx.fillStyle='#172033';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(c.x+' ('+c.xu+')',L+w/2,H-16);ctx.save();ctx.translate(20,T+h/2);ctx.rotate(-Math.PI/2);ctx.fillText(c.y+' ('+c.yu+')',0,0);ctx.restore()}
function makeTable(){const n=c.xs.length;holes=shuffle([...Array(n*2).keys()]).slice(0,4);$('thead').innerHTML='<tr><th>Magnitud</th>'+c.xs.map((_,i)=>'<th>P'+(i+1)+'</th>').join('')+'</tr>';$('tbody').innerHTML=[[c.x,c.xu,c.xs],[c.y,c.yu,c.ys]].map((r,ri)=>'<tr><th>'+r[0]+' ('+r[1]+')</th>'+r[2].map((v,i)=>{const k=ri*n+i;return '<td>'+(holes.includes(k)?'<input data-k="'+k+'" inputmode="decimal" aria-label="Dato que falta">':v)+'</td>'}).join('')+'</tr>').join('')}
function fresh(){let ix;do{ix=Math.floor(Math.random()*cases.length)}while(ix===last&&cases.length>1);last=ix;c=cases[ix];firstCheck=true;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('round').textContent='Intento '+round;['ind','dep','tind','tdep','uind','udep'].forEach(id=>$(id).className='');
$('tind').value='';$('tdep').value='';setOpts('ind',c.x,vars);setOpts('dep',c.y,vars);setOpts('uind',c.xu,units);setOpts('udep',c.yu,units);makeTable();draw()}
function mark(el,ok){el.classList.remove('ok','ko');el.classList.add(ok?'ok':'ko')}
$('form').addEventListener('submit',e=>{e.preventDefault();const checks=[['ind',c.x],['dep',c.y],['tind',tipo(c.x)],['tdep',tipo(c.y)],['uind',c.xu],['udep',c.yu]];let good=0,total=checks.length+holes.length;checks.forEach(([id,ans])=>{const ok=$(id).value===ans;mark($(id),ok);if(ok)good++});document.querySelectorAll('input[data-k]').forEach(inp=>{const k=+inp.dataset.k,n=c.xs.length,ans=k<n?c.xs[k]:c.ys[k-n],val=Number(inp.value.trim().replace(',','.')),ok=inp.value.trim()!==''&&val===ans;mark(inp,ok);if(ok)good++});
const all=good===total,fb=$('feedback');fb.classList.remove('hidden');if(all){if(firstCheck){perfect++;$('score').textContent=(perfect*2.5).toFixed(1).replace('.',',');$('perfects').textContent=perfect+' / 4 perfectos';fb.innerHTML='<b>¡Perfecto!</b> '+good+' de '+total+' respuestas correctas. Este intento suma 2,5 puntos.'}else fb.innerHTML='<b>¡Ya está todo correcto!</b> Este intento no suma como perfecto porque hubo algún error en la primera comprobación.';$('next').classList.remove('hidden');if(perfect>=4){fb.innerHTML='<b>¡10 conseguido!</b> Has completado cuatro ejercicios perfectos.';$('next').classList.add('hidden')}}else{firstCheck=false;fb.innerHTML='Has acertado <b>'+good+' de '+total+'</b>. Los aciertos están en verde y los errores en rojo. Corrige solo lo necesario y vuelve a pulsar <b>Comprobar</b>.'}});
$('next').addEventListener('click',()=>{round++;fresh()});fresh();
})();
</script></body></html>
